name: Download CS Game Files

on:
  schedule:
  - cron: "17 0 * * *" # UTC 00:17 -> 北京时间 08:17
  - cron: "43 1 * * *" # UTC 01:43 -> 北京时间 09:43
  - cron: "26 5 * * *" # 北京时间 13:26，兜底补跑
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
    download:
      runs-on: ubuntu-latest

      permissions:
        # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
        contents: write

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
        - name: Download new game files
          run: npm install && node index.js "${{ secrets.USERNAME }}" "${{ secrets.PASSWORD }}" "${{ secrets.SHARED_SECRET }}"
        - name: Read manifestId.txt
          id: manifestId
          uses: juliangruber/read-file-action@v1
          with:
            path: ./static/manifestId.txt
        - name: Commit & push changes
          uses: stefanzweifel/git-auto-commit-action@v4
          with:
            commit_message: "manifest ${{ steps.manifestId.outputs.content }}"

